services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      TESTING: "false"
      MEGALOC_DEVICE: "cpu"
    # MegaLoc weights (data/huggingface, data/megaloc) and the exported gallery index
    # (data/benchmarks/runs/...) are read from the mounted data directory.
    volumes:
      - ./data:/app/data
