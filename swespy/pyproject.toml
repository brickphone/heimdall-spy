[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "swespy"
version = "0.1.0"
description = "SweSpy geolocation inference API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers==4.46.3",
    "datasets==3.1.0",
    "qdrant-client==1.12.1",
    "fastapi==0.115.6",
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "httpx==0.28.1",
    "s2sphere==0.2.5",
    "pillow==11.1.0",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "loguru==0.7.3",
    "tenacity==9.0.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "numpy==1.26.4",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "ruff==0.9.1",
    "mypy==1.14.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["swespy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
